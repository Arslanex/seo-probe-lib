# Postgres (audits, encrypted Google tokens) and Redis (Celery broker, pending OAuth requests).
# Non-default host ports, so they do not clash with a database you already run.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seoprobe
      POSTGRES_PASSWORD: seoprobe
      POSTGRES_DB: seoprobe
    ports: ["15432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]
